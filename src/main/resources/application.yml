spring:
  profiles:
    active: local
    group:
      local: local, common
      blue: blue, common
      green: green, common

server:
  env: blue
---

spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        registration:
          google:
            redirectUri: http://localhost:8080/login/oauth2/code/google

server:
  port: 8080
  serverAddress: localhost

serverName: local_server

---

---

spring:
  config:
    activate:
      on-profile: blue
  security:
    oauth2:
      client:
        registration:
          google:
            redirectUri: http://${LIVE_SERVER_IP}/login/oauth2/code/google

server:
  port: 8080
  serverAddress: ${LIVE_SERVER_IP}

serverName: blue_server

---

---

spring:
  config:
    activate:
      on-profile: green
  security:
    oauth2:
      client:
        registration:
          google:
            redirectUri: http://${LIVE_SERVER_IP}/login/oauth2/code/google

server:
  port: 8081
  serverAddress: ${LIVE_SERVER_IP}

serverName: green_server

---

spring:
  config:
    activate:
      on-profile: common
  application:
    name: ecommerce
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # 기본값 10 → 30. 재고 판정을 Redis로 옮겨 주문 트랜잭션끼리 공유하는 락이 없어졌으므로 커넥션이 병렬로 일한다.
      # 출발점: HikariCP 권장식 (DB 코어 수 × 2 + 디스크 수) ≈ 10 × 2 + 1 = 21
      # 측정(재고 1,000 / 주문 3,000건): 10개 423 TPS → 30개 약 600 TPS
      # 제약: 모든 앱 인스턴스의 합이 MySQL max_connections(기본 151)를 넘지 않아야 한다 (Blue/Green 2대 = 60)
      maximum-pool-size: 30
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 1000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.orm.jdbc.batch: trace
    org.hibernate.orm.jdbc.mutation: debug

jwt:
  secret-key: ${JWT_SECRET_KEY}
  rt-secret-key: ${JWT_RT_SECRET_KEY}
  validity-in-milliseconds: ${JWT_VALIDITY_MS}
  rt-validity-in-milliseconds: ${JWT_RT_VALIDITY_MS}
  temp-validity-in-milliseconds: ${JWT_TEMP_VALIDITY_MS}
