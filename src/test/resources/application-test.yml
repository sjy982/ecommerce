jwt:
  secret-key: dGVzdC1sb25nLWxvbmctbG9uZy1sb25nLWxvbmctbG9uZy1zZWNyZXQta2V5
  rt-secret-key: dGVzdC1kaWZmZXJlbnQtbG9uZy1sb25nLWxvbmctbG9uZy1zZWNyZXQta2V5
  validity-in-milliseconds: 3600000
  rt-validity-in-milliseconds: 7200000
  temp-validity-in-milliseconds: 600000

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  application:
    name: ecommerce-test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8081
payment:
  sweeper:
    # 일반 테스트 중에는 스위퍼가 다른 테스트의 PENDING job을 가져가지 않도록 사실상 꺼 둔다.
    # 스위퍼를 검증하는 테스트(PaymentSweeperIntegrationTest)만 전용 DB에서 짧게 켠다.
    initial-delay-ms: 3600000
